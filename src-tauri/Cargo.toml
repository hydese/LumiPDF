[package]
name = "lumipdf"
version = "2.0.0-beta.2"
description = "A lightweight PDF reader for studying, with a dark mode that stays as crisp as the original."
authors = ["hydese"]
license = "MIT"
repository = "https://github.com/hydese/LumiPDF"
edition = "2021"
rust-version = "1.85"

[lib]
name = "lumipdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
lopdf = "0.47.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
rayon = "1.11"
flate2 = "1"
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.4"
tauri-plugin-updater = "2.14.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
