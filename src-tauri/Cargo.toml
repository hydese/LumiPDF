[package]
name = "lumipdf"
version = "2.0.0-alpha.0"
description = "A lightweight PDF reader for studying, with a dark mode that stays as crisp as the original."
authors = ["hydese"]
license = "MIT"
repository = "https://github.com/hydese/LuminaPDF"
edition = "2021"
rust-version = "1.85"

[lib]
name = "lumipdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
