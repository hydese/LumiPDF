# ONE-OFF: copies the updater key secrets from this repository to the private lab repository,
# so the lab can build signed releases. Run by hand once, then this file is deleted.
# The values are never printed: they are encrypted for the lab with its public key (sealed box)
# and sent straight to GitHub's API. Needs LAB_TOKEN with "Secrets: read and write" on the lab.
name: Copy secrets to the lab (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt and send
        env:
          LAB_TOKEN: ${{ secrets.LAB_TOKEN }}
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pip install --quiet pynacl requests
          python3 - <<'PY'
          import base64, os, sys, requests
          from nacl import encoding, public
          api = "https://api.github.com/repos/hydese/LumiPDF-lab/actions/secrets"
          h = {"Authorization": f"Bearer {os.environ['LAB_TOKEN']}", "Accept": "application/vnd.github+json"}
          r = requests.get(f"{api}/public-key", headers=h)
          if r.status_code != 200:
              sys.exit(f"Can't read the lab's public key (HTTP {r.status_code}): the token needs Secrets: read and write on LumiPDF-lab.")
          key = r.json()
          box = public.SealedBox(public.PublicKey(key["key"].encode(), encoding.Base64Encoder()))
          for name, env in [("TAURI_SIGNING_PRIVATE_KEY", "KEY"), ("TAURI_SIGNING_PRIVATE_KEY_PASSWORD", "PASSWORD")]:
              value = os.environ.get(env, "")
              if not value:
                  sys.exit(f"{name} is empty in this repository.")
              sealed = base64.b64encode(box.encrypt(value.encode())).decode()
              r = requests.put(f"{api}/{name}", headers=h, json={"encrypted_value": sealed, "key_id": key["key_id"]})
              if r.status_code not in (201, 204):
                  sys.exit(f"{name}: HTTP {r.status_code}")
              print(f"{name}: copied ({len(value)} characters)")
          PY
