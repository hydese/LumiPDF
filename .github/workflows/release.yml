# Builds a release from a version tag (v2.0.0, v2.1.0-beta.1, …) and saves it as a DRAFT on
# GitHub. Nothing is public until a person publishes the draft; publishing runs channels.yml,
# which points the in-app updater at it.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           the updater private key (contents of the .key file)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
name: Release

# Three ways to start it:
#  - push a commit to main whose message contains [release]: the version comes from
#    package.json and the tag (vX.Y.Z) is created here;
#  - push a version tag;
#  - run it by hand (the workflow must be on the default branch for that).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      macos:
        description: Also build the macOS app
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  meta:
    name: Version
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      macos: ${{ steps.v.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$tag" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match package.json ($tag)"; exit 1
          fi
          mac=false
          case "$MESSAGE" in *"[mac]"*) mac=true;; esac
          [ "${{ inputs.macos }}" = "true" ] && mac=true
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "macos=$mac" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (macOS: $mac)"

  windows:
    name: Windows (signed for the updater)
    needs: meta
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Check the signing key is there
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret (see the top of release.yml)"; exit 1
          fi
      - run: npx tauri build --bundles nsis --config src-tauri/tauri.release.conf.json
      - name: Collect files
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe out/
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe.sig out/
          # No portable here: public releases are installer-only (the portable build is for
          # testing and comes from the CI workflow's artifacts).
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: out/*

  macos:
    name: macOS (Apple Silicon, unsigned by Apple)
    needs: meta
    if: needs.meta.outputs.macos == 'true'
    runs-on: macos-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --bundles app --config src-tauri/tauri.release.conf.json
      - name: Collect files
        run: |
          v=$(node -p "require('./package.json').version")
          mkdir out
          b=src-tauri/target/release/bundle/macos
          cp "$b/LumiPDF.app.tar.gz" "out/LumiPDF_${v}_aarch64.app.tar.gz"
          cp "$b/LumiPDF.app.tar.gz.sig" "out/LumiPDF_${v}_aarch64.app.tar.gz.sig"
          ditto -c -k --keepParent "$b/LumiPDF.app" "out/LumiPDF_${v}_aarch64.app.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: out/*

  draft:
    name: Draft release
    needs: [meta, windows, macos]
    if: always() && needs.windows.result == 'success' && needs.macos.result != 'failure'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Create the tag (when started from a [release] commit)
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG exists"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
      - uses: actions/download-artifact@v8
        with:
          path: built
          merge-multiple: true
      - run: node scripts/release-manifest.mjs "$TAG" built meta
      - name: Create the draft (or refresh its files)
        run: |
          v="${TAG#v}"
          pre=""; case "$v" in *-*) pre="--prerelease";; esac
          files=$(ls built/* | grep -v '\.sig$')
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files meta/latest.json --clobber
          else
            gh release create "$TAG" $files meta/latest.json --draft $pre --verify-tag \
              --title "LumiPDF $v" --notes-file meta/release-notes.md
          fi
