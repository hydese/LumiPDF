name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Also build the macOS app
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Rendering bench (Chromium)
        run: |
          npx playwright install --with-deps chromium
          npm run bench -- --browser chromium --themes original,lumina-black
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-chromium
          path: tests/bench/out
          retention-days: 7

  windows:
    name: Windows build
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: LumiPDF-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
      # The same build as a single exe that runs without installing (no auto-update, no "Open with").
      - name: Prepare portable exe
        shell: pwsh
        run: Copy-Item src-tauri/target/release/lumipdf.exe LumiPDF-portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: LumiPDF-windows-portable
          path: LumiPDF-portable.exe
          retention-days: 14

  # Only when asked: run the workflow by hand with "macos" ticked, or put [mac] in the commit message.
  macos:
    name: macOS build
    needs: checks
    if: inputs.macos || contains(github.event.head_commit.message, '[mac]')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build app (unsigned)
        run: npx tauri build --bundles app
      # Zipped with ditto so the .app bundle keeps its structure and permissions.
      - name: Package app for download
        run: ditto -c -k --keepParent src-tauri/target/release/bundle/macos/LumiPDF.app LumiPDF-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LumiPDF-macos-app
          path: LumiPDF-macos.zip
          retention-days: 14
      - name: Rendering bench (WebKit, the engine the macOS app uses)
        run: |
          npx playwright install webkit
          npm run bench -- --browser webkit --themes original,lumina-black
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-webkit
          path: tests/bench/out
          retention-days: 7
